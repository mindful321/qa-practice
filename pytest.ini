[pytest]
testpaths = tests
# Chromium only. Keep a screenshot, video and trace for failed tests under test-results/,
# and write a self-contained HTML report to report/index.html.
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --html report/index.html
    --self-contained-html
# A known-bug test marked xfail must fail. If it starts passing, pytest reports it
# as a failure, so a fixed bug (or a broken test) gets noticed.
xfail_strict = true
# Comes from the pytest-base-url plugin (used by pytest-playwright), not from this repo.
filterwarnings =
    ignore:Session-scoped fixtures defined as instance methods are deprecated
